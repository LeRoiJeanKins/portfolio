services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: group_server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: group_client
    ports:
      - "5173:5173"
    restart: unless-stopped
